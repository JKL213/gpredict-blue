name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool intltool autoconf automake \
            libcurl4-openssl-dev pkg-config libglib2.0-dev libgtk-3-dev \
            flatpak flatpak-builder

      - name: Build and test
        run: |
          ./autogen.sh
          make -j"$(nproc)"
          make check

      - name: Create source tarball
        run: make dist

      - name: Build Flatpak bundle
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//47 org.gnome.Sdk//47
          cd flatpak
          flatpak-builder --force-clean --user --repo=repo build-dir io.github.jkl213.GpredictBlue.yml
          flatpak build-bundle repo ../gpredict-blue.flatpak io.github.jkl213.GpredictBlue

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gpredict-*.tar.bz2
            gpredict-blue.flatpak
          generate_release_notes: true
