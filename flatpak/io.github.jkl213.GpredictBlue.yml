app-id: io.github.jkl213.GpredictBlue
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: gpredict

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: gpredict-blue
    buildsystem: autotools
    config-opts:
      - --prefix=/app
    sources:
      - type: dir
        path: ..
    build-options:
      cflags: -O2 -g
      cxxflags: -O2 -g
    post-install:
      - install -Dm644 ../data/desktop/gpredict.desktop /app/share/applications/gpredict.desktop
      - install -Dm644 ../data/metainfo/io.github.jkl213.GpredictBlue.metainfo.xml /app/share/metainfo/io.github.jkl213.GpredictBlue.metainfo.xml
